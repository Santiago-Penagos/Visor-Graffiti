<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Visor de Grafitis - Distrito Grafiti</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #map { height: 100vh; margin: 0; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Crear el mapa centrado en Bogotá (aprox. Distrito Grafiti)
    var map =   L.map('map').setView([4.6261, -74.1118], 18)

    // Capa de mapa de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Pedir los grafitis a la API y pintar un marcador por cada uno
    fetch('/api/grafitis')
      .then(function (res) { return res.json(); })
      .then(function (grafitis) {
        grafitis.forEach(function (g) {
          L.marker([g.latitud, g.longitud])
            .addTo(map)
            .bindPopup(
              '<b>' + g.nombre + '</b><br>' +
              'Artista: ' + g.artista + '<br>' +
              g.descripcion + '<br>' +
              '<a href="' + g.enlace_maps + '" target="_blank">Ver en Google Maps</a>'
            );
        });
      });
  </script>
</body>
</html>
